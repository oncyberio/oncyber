# coturn config for the oncyber TURN relay.
# static-auth-secret and external-ip are passed on the command line from the
# compose env (see infra/vm/docker-compose.yml) so no secret lives in this file.

listening-port=3478
listening-ip=0.0.0.0

# Time-limited HMAC credentials minted by GET /turnCredentials on the
# Colyseus server (coturn REST/ephemeral scheme).
use-auth-secret

realm=arena.oncyber.io

fingerprint

# Relay port range — must match the GCP firewall rule (udp 49152-65535).
min-port=49152
max-port=65535

# Don't let the relay reach internal/cloud-metadata networks.
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Per credential: 8 peers x 2 TURN transports = 16 possible allocations,
# plus one overlapping generation = 32. Candidates can allocate even when
# direct media wins; this allowance is not a capacity guarantee.
total-quota=1200
user-quota=32
stale-nonce=600

no-cli
