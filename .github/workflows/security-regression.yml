name: Security regressions

on:
  pull_request:
    paths: ["frontend/**", "cloud-functions/functions/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc", "vendor/**", ".github/workflows/security-regression.yml"]
  push:
    paths: ["frontend/**", "cloud-functions/functions/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc", "vendor/**", ".github/workflows/security-regression.yml"]

permissions:
  contents: read

concurrency:
  group: security-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.12.2 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -C frontend exec jest --runInBand utils/security utils/rpc/server.privacy.test.ts utils/voiceChat/legacyTokenRoutes.test.ts

  cloud-image-fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud-functions/functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud-functions/functions/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/publicImageSource.test.cjs
